name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "README.md"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "capacitor.config.ts"
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests and lint
        run: |
          bun run test
          bun run lint

      - name: Build web app
        run: bun run build

      - name: Verify Capacitor web entry
        run: |
          if [ ! -f .output/public/index.html ]; then
            echo "::error::.output/public/index.html was not generated. Expected the configured TanStack Start SPA shell."
            echo "Generated public output:"
            find .output/public -maxdepth 3 -type f | head -100 || true
            echo "Generated build output:"
            find .output -maxdepth 2 -type f | head -100 || true
            exit 1
          fi
          test -s .output/public/index.html
          test -s .output/public/memoscan-logo.svg

      - name: Add Android platform if missing
        run: |
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            bunx cap add android
          fi

      - name: Ensure in-app camera permission
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          test -f "$manifest"
          if ! grep -q 'android.permission.CAMERA' "$manifest"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.CAMERA" />' "$manifest"
          fi
          grep -q 'android.permission.CAMERA' "$manifest"

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Verify Waraqah web branding is bundled
        run: |
          grep -R -q 'Waraqah' .output/public
          grep -R -q 'ورقة' .output/public
          test -s .output/public/memoscan-logo.svg

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: waraqah-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
