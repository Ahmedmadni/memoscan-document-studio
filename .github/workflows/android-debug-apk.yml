name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "README.md"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "eslint.config.js"
      - ".prettierrc"
      - ".prettierignore"
      - "capacitor.config.ts"
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Auto-format check and run tests + lint
        run: |
          bunx prettier --write src
          bun run test
          bun run lint

      - name: Build web app
        run: bun run build

      - name: Verify Capacitor web entry
        run: |
          if [ ! -f .output/public/index.html ]; then
            echo "::error::.output/public/index.html was not generated. Expected the configured TanStack Start SPA shell."
            echo "Generated public output:"
            find .output/public -maxdepth 3 -type f | head -100 || true
            echo "Generated build output:"
            find .output -maxdepth 2 -type f | head -100 || true
            exit 1
          fi
          test -s .output/public/index.html
          test -s .output/public/memoscan-logo.svg

      - name: Add Android platform if missing
        run: |
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            bunx cap add android
          fi

      - name: Install SVG rasterizer for native launcher icons
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Apply Waraqah launcher icons
        shell: bash
        run: |
          set -euo pipefail
          manifest="android/app/src/main/AndroidManifest.xml"
          test -s public/memoscan-logo.svg
          declare -A sizes=([mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192)
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            size="${sizes[$density]}"
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            rsvg-convert -w "$size" -h "$size" public/memoscan-logo.svg -o "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_foreground.png"
          done
          adaptive="android/app/src/main/res/mipmap-anydpi-v26"
          mkdir -p "$adaptive"
          cat > "$adaptive/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          XML
          cp "$adaptive/ic_launcher.xml" "$adaptive/ic_launcher_round.xml"
          grep -q 'android:icon="@mipmap/ic_launcher"' "$manifest"
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s "$adaptive/ic_launcher.xml"

      - name: Ensure in-app camera and hardware acceleration permissions
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          test -f "$manifest"
          if ! grep -q 'android.permission.CAMERA' "$manifest"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.CAMERA" />' "$manifest"
          fi
          grep -q 'android.permission.CAMERA' "$manifest"

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Verify Waraqah web branding is bundled
        run: |
          grep -R -q 'Waraqah' .output/public
          grep -R -q 'ورقة' .output/public
          test -s .output/public/memoscan-logo.svg

      - name: Allow more time for the Gradle distribution download
        run: |
          wrapper=android/gradle/wrapper/gradle-wrapper.properties
          sed -i '/^networkTimeout=/d' "$wrapper"
          printf '\nnetworkTimeout=120000\n' >> "$wrapper"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build and sign release APK when configured
        id: release
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice::Release signing is skipped because ANDROID_KEYSTORE_BASE64 is not configured."
            exit 0
          fi
          : "${ANDROID_KEYSTORE_PASSWORD:?Configure ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Configure ANDROID_KEY_ALIAS}"
          export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          ./gradlew assembleRelease --no-daemon
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/waraqah-release.XXXXXX")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          release_dir=app/build/outputs/apk/release
          "$apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$release_dir/waraqah-release-signed.apk" "$release_dir/app-release-unsigned.apk"
          "$apksigner" verify "$release_dir/waraqah-release-signed.apk"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: waraqah-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        if: steps.release.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: waraqah-android-release-apk
          path: android/app/build/outputs/apk/release/waraqah-release-signed.apk
          if-no-files-found: error
          retention-days: 30
